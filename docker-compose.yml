services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: webbanquanao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/webbanquanao
      FLASK_ENV: development
      PYTHONUNBUFFERED: 1
      SECRET_KEY: your-secret-key-change-in-production
      # VNPay sandbox configuration
      VNPAY_VERSION: "2.1.0"
      VNPAY_TMN_CODE: "YK2WG11S"
      VNPAY_HASH_SECRET: "6LLXT3B13629FZP7G7JO1EDDV9OQLS1K"
      VNPAY_PAYMENT_URL: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
      VNPAY_RETURN_URL: "http://localhost:5000/api/vnpay/return"
      PUBLIC_BASE_URL: "http://localhost:5000"
      FRONTEND_URL: "http://localhost:5173"
      # SMTP configuration for password reset emails
      SMTP_SERVER: "smtp.gmail.com"
      SMTP_PORT: "587"
      SMTP_USER: "duongminhtri9311@gmail.com"
      SMTP_PASSWORD: "ggscuurcikiwcyza"
      # OpenWeatherMap API Key
      OPENWEATHER_API_KEY: "88b5318004f13c1bdbbba8a221833b9c"
      # Gemini API Configuration
      GEMINI_API_KEY: "AIzaSyBL1eqjNRCSVgTW4NufX37sCpCdVAJDvco"
      # Email Validation APIs
      # Mailboxlayer API (ưu tiên - 250 requests/month miễn phí)
      MAILBOXLAYER_API_KEY: "7654f228e277563ec7b323736572f6d4"
      # ZeroBounce API (5 credits miễn phí)
      ZEROBOUNCE_API_KEY: ""
      # Abstract Email Reputation API (fallback - 100 requests/month)
      ABSTRACT_API_KEY: ""
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/admin.html:/app/admin.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
    environment:
      VITE_API_URL: http://localhost:5000

volumes:
  postgres_data:
